<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Define o conjunto de caracteres -->
    <meta charset="UTF-8">

    <!-- Título da página (aparece na aba do navegador) -->
    <title>Alterar Texto</title>
</head>

<body>

    <!-- Parágrafo que terá o texto alterado -->
    <p id="texto">Clique no botão para mudar este texto.</p>

    <!-- Botão que chama a função "mudarTexto()" ao ser clicado -->
    <button onclick="mudarTexto()">Clique aqui</button>

    <!-- Importa o arquivo JavaScript onde está a função -->
    <script src="script.js"></script>

</body>
</html>
