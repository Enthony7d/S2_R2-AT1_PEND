<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Define o conjunto de caracteres -->
    <meta charset="UTF-8">

    <!-- Título da página -->
    <title>Lista Dinâmica</title>

    <style>
        /* Estilo geral da página */
        body{
            font-family: Arial, sans-serif; /* Fonte */
            background: linear-gradient(135deg, #4facfe, #00f2fe); /* Fundo em degradê */
            display: flex; /* Ativa flexbox */
            justify-content: center; /* Centraliza horizontalmente */
            align-items: center; /* Centraliza verticalmente */
            height: 100vh; /* Altura total da tela */
        }

        /* Caixa principal */
        .container{
            background: white; /* Fundo branco */
            padding: 30px; /* Espaçamento interno */
            border-radius: 10px; /* Bordas arredondadas */
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); /* Sombra */
            width: 300px; /* Largura fixa */
            text-align: center; /* Centraliza o texto */
        }

        /* Título */
        h2{
            margin-bottom: 20px; /* Espaço abaixo */
        }

        /* Campo de entrada */
        input{
            width: 70%; /* Ocupa 70% da largura */
            padding: 8px; /* Espaçamento interno */
            border-radius: 5px; /* Bordas arredondadas */
            border: 1px solid #ccc; /* Borda cinza */
        }

        /* Botão */
        button{
            padding: 7px 10px;
            border: none;
            background: #4facfe; /* Cor azul */
            color: white; /* Texto branco */
            border-radius: 3px;
            cursor: pointer; /* Cursor de clique */
            margin-left: 3px;
        }

        /* Efeito ao passar o mouse */
        button:hover{
            background: #2f8cff; /* Azul mais escuro */
        }

        /* Lista */
        ul{
            margin-top: 20px; /* Espaço acima */
            text-align: left; /* Alinha itens à esquerda */
        }

        /* Cada item da lista */
        li{
            padding: 5px;
            border-bottom: 1px solid #eee; /* Linha separadora */
        }
    </style>
</head>

<body>

    <!-- Container principal -->
    <div class="container">

        <!-- Título -->
        <h2>Lista de Itens</h2>

        <!-- Campo para digitar o item -->
        <input type="text" id="itemInput" placeholder="Digite um item">

        <!-- Botão para adicionar item -->
        <button id="addBtn">Adicionar</button>

        <!-- Lista onde os itens serão adicionados dinamicamente -->
        <ul id="lista"></ul>
    </div>

    
    <script src="script.js"></script>

</body>
</html>
