<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lista Dinâmica</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container{
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        width: 300px;
        text-align: center;
    }

    h2{
        margin-bottom: 20px;
    }

    input{
        width: 70%;
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    button{
        padding: 7px 10px;
        border: none;
        background: #4facfe;
        color: white;
        border-radius: 3px;
        cursor: pointer;
        margin-left: 3px;
    }

    button:hover{
        background: #2f8cff;
    }

    ul{
        margin-top: 20px;
        text-align: left;
    }

    li{
        padding: 5px;
        border-bottom: 1px solid #eee;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Lista de Itens</h2>

    <input type="text" id="itemInput" placeholder="Digite um item">
    <button id="addBtn">Adicionar</button>

    <ul id="lista"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
