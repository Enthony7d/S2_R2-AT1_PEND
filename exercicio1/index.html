<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Saudação</title>

<style>
body{
    font-family: Arial;
    background-color: #f2f2f2;
    text-align: center;
    margin-top: 100px;
}

.container{
    background: white;
    padding: 30px;
    border-radius: 10px;
    width: 300px;
    margin: auto;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

input{
    padding: 8px;
    width: 80%;
    margin-bottom: 10px;
}

button{
    padding: 8px 15px;
    background-color: #007BFF;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover{
    background-color: #0056b3;
}

#mensagem{
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
<h2>Digite seu nome</h2>

<input type="text" id="nome" placeholder="Seu nome">

<br>

<button onclick="mostrarMensagem()">Enviar</button>

<p id="mensagem"></p>
</div>

<script>
function mostrarMensagem(){

    
    let nomeDigitado = document.getElementById("nome").value;

    
    document.getElementById("mensagem").innerText =
    "Olá, " + nomeDigitado + "! Seja bem-vindo!";
}
</script>

</body>
</html>
